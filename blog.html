  <title>Blog | Crestline Developers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Blog","name":"Crestline Insights","description":"Construction tips, home design and building planning."}
  </script>
</head>
<body>
  <div id="loader"><div class="loader-logo">Crestline <span>Developers</span></div><div class="loader-bar"></div></div>
  <div id="scroll-progress"></div>
  <div id="site-header"></div>
  <div id="floating-ui"></div>

  <header class="page-hero" style="background-image:url('https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1920&q=80')">
    <div class="container">
      <h1 data-aos="fade-up">Blog & Insights</h1>
      <div class="breadcrumb-custom" data-aos="fade-up" data-aos-delay="80">
        <a href="index.html">Home</a><span>/</span><span>Blog</span>
      </div>
    </div>
  </header>

  <section>
    <div class="container">
      <div class="text-center mb-4" data-aos="fade-up">
        <span class="section-eyebrow">Knowledge Hub</span>
        <h2 class="section-title">Latest Articles</h2>
        <div class="section-divider"></div>
      </div>

      <div class="filter-bar" data-aos="fade-up">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Construction Tips">Construction Tips</button>
        <button class="filter-btn" data-filter="Home Design">Home Design</button>
        <button class="filter-btn" data-filter="Building Planning">Building Planning</button>
      </div>

      <div class="row g-4" id="blogGrid"></div>
    </div>
  </section>

  <!-- Article Modal -->
  <div class="modal fade" id="blogModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content modal-content-custom">
        <div class="modal-header">
          <h5 class="modal-title" id="blogModalTitle">Article</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <img id="blogModalImg" src="" alt="" class="rounded w-100 mb-3" style="max-height:320px;object-fit:cover;" loading="lazy">
          <div class="small text-muted mb-3" id="blogModalMeta"></div>
          <p id="blogModalBody" class="text-muted mb-0"></p>
        </div>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/blog.js"></script>
