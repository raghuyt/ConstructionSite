<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crestline Developers gallery — construction photos, team moments, finished projects and videos.">
  <meta property="og:title" content="Gallery | Crestline Developers">
  <meta property="og:description" content="Browse construction, team and finished project photography.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=1200&q=80">
  <title>Gallery | Crestline Developers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/glightbox@3.3.0/dist/css/glightbox.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <div id="loader"><div class="loader-logo">Crestline <span>Developers</span></div><div class="loader-bar"></div></div>
  <div id="scroll-progress"></div>
  <div id="site-header"></div>
  <div id="floating-ui"></div>

  <header class="page-hero" style="background-image:url('https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=1920&q=80')">
    <div class="container">
      <h1 data-aos="fade-up">Gallery</h1>
      <div class="breadcrumb-custom" data-aos="fade-up" data-aos-delay="80">
        <a href="index.html">Home</a><span>/</span><span>Gallery</span>
      </div>
    </div>
  </header>

  <section>
    <div class="container">
      <div class="text-center mb-4" data-aos="fade-up">
        <span class="section-eyebrow">Visual Stories</span>
        <h2 class="section-title">Moments From Our Sites</h2>
        <div class="section-divider"></div>
        <p class="section-lead">Filter by category and open any image for a lightbox preview with zoom.</p>
      </div>

      <div class="filter-bar" data-aos="fade-up">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="construction">Construction</button>
        <button class="filter-btn" data-filter="team">Team</button>
        <button class="filter-btn" data-filter="finished">Finished Projects</button>
        <button class="filter-btn" data-filter="video">Videos</button>
      </div>

      <div class="row g-3" id="galleryGrid"></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/glightbox@3.3.0/dist/js/glightbox.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/gallery.js"></script>
</body>
</html>
