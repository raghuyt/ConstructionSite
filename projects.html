<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore Crestline Developers projects — residential, commercial, villas and apartments. Filter by status and type.">
  <meta property="og:title" content="Projects | Crestline Developers">
  <meta property="og:description" content="Featured and latest construction projects by Crestline Developers.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=1200&q=80">
  <title>Projects | Crestline Developers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"CollectionPage","name":"Crestline Projects","description":"Portfolio of residential and commercial developments."}
  </script>
</head>
<body>
  <div id="loader"><div class="loader-logo">Crestline <span>Developers</span></div><div class="loader-bar"></div></div>
  <div id="scroll-progress"></div>
  <div id="site-header"></div>
  <div id="floating-ui"></div>

  <header class="page-hero" style="background-image:url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1920&q=80')">
    <div class="container">
      <h1 data-aos="fade-up">Our Projects</h1>
      <div class="breadcrumb-custom" data-aos="fade-up" data-aos-delay="80">
        <a href="index.html">Home</a><span>/</span><span>Projects</span>
      </div>
    </div>
  </header>

  <section>
    <div class="container">
      <div class="search-box" data-aos="fade-up">
        <i class="bi bi-search"></i>
        <input type="search" id="projectSearch" placeholder="Search by name, location, type..." aria-label="Search projects">
      </div>

      <div class="filter-bar" data-aos="fade-up">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Ongoing">Ongoing</button>
        <button class="filter-btn" data-filter="Completed">Completed</button>
        <button class="filter-btn" data-filter="Residential">Residential</button>
        <button class="filter-btn" data-filter="Commercial">Commercial</button>
        <button class="filter-btn" data-filter="Villas">Villas</button>
        <button class="filter-btn" data-filter="Apartments">Apartments</button>
      </div>

      <div class="row g-4" id="projectsGrid"></div>
    </div>
  </section>

  <section class="cta-section">
    <div class="container text-center position-relative" style="z-index:1;" data-aos="fade-up">
      <h2 class="mb-3">Have a Project in Mind?</h2>
      <p class="mb-4 opacity-75">Tell us about your vision — we'll craft a tailored proposal.</p>
      <button class="btn-primary-custom" data-bs-toggle="modal" data-bs-target="#quoteModal">Request a Quote</button>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/projects.js"></script>
</body>
</html>
